name: Publish Existing Release to Modrinth and CurseForge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag"
        required: true
        default: "v2.16.0"
      version:
        description: "Platform version number"
        required: true
        default: "2.16.0"
      file:
        description: "Release asset file name"
        required: true
        default: "AcuteLoot-2.16.0.jar"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "${{ inputs.file }}" --dir release

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: 'Pool7IDt'
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: '1435207'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            release/${{ inputs.file }}

          name: AcuteLoot ${{ inputs.version }}
          version: ${{ inputs.version }}
          version-type: release
          changelog: |
            - Added support for Minecraft 26.1.2
            - Added support for new materials like Maces, Spears, Copper gear, and more.
            - Overhauled material compatibility to use XSeries/XMaterial parsing to better support materials across versions
            - Improved enchanting rarity scoring so more armor pieces can reach higher rarity outcomes.
            - Added anvil loot name-preservation controls for Shield and Elytra generation.

          loaders: |
            spigot
            paper
            purpur
          game-versions: |
            1.15
            1.15.1
            1.15.2
            1.16
            1.16.1
            1.16.2
            1.16.3
            1.16.4
            1.16.5
            1.17
            1.17.1
            1.18
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11

          fail-mode: fail
